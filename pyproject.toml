[project]
name = "legal-summarization"
version = "0.1.0"
description = "Legal text summarization POC using extractive summarization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "pytest>=7.0.0",
]

[project.scripts]
legal-summarize = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
